; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-2432S028R ("CYD") firmware target.
; board = esp32dev is intentional: there is no distinct PlatformIO board entry
; for the CYD. Display config comes from the LGFX_Device subclass in
; include/LGFX_CYD.hpp (LovyanGFX is configured in C++, not via build_flags).
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 3 MB app partition instead of the default 1.25 MB (two OTA slots): the
; firmware outgrew 97% of the default, and the Polish-capable efont fonts
; alone are ~700 KB. NVS stays at the same offset, so saved settings survive.
; Trade-off: a single app slot — no OTA updates (flashing is over USB anyway).
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    bblanchon/ArduinoJson

; Native (host) environment for pure-logic unit tests: bbox math, distance/
; bearing, sorting, token-expiry timing, aircraft_lookup cache, credit-cost
; calculation, JSON parsing, etc. No ESP32, no LovyanGFX, no display, no
; network — see "Testing" in CLAUDE.md. Run with `pio test -e native`.
[env:native]
platform = native
; PlatformIO doesn't link src/ into test builds unless told to.
test_build_src = yes
; Exclude the Arduino entry point: main.cpp pulls in Arduino.h/LovyanGFX,
; which don't exist on the native (host) platform. Pure-logic modules added
; to src/ later stay included so tests can link against them.
build_src_filter =
    +<*>
    -<main.cpp>
lib_deps =
    bblanchon/ArduinoJson
build_flags =
    -std=gnu++17
    -DUNIT_TEST
[platformio]
default_envs = cyd