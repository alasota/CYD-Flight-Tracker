; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-2432S028R ("CYD") firmware target.
; board = esp32dev is intentional: there is no distinct PlatformIO board entry
; for the CYD. Display config comes from the LGFX_Device subclass in
; src/display/adapters/lgfx/LGFX_CYD.hpp (LovyanGFX is configured in C++, not via build_flags).
[env:cyd]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two OTA app slots of 1.875 MB each (app0 / app1). The firmware is ~1.3 MB
; since the efont fonts were cut to the characters the display uses
; (tools/subset_efont.py), so it fits with room to spare; the default table's
; 1.25 MB slots would be too small. NVS (0x9000), otadata and coredump sit at
; the same offsets as in the huge_app.csv table used before, so settings and
; hexdb.io caches survive the switch. The 128 KB spiffs partition is unused.
; Changing the table needs one USB upload (`pio run -t upload`); after that
; both slots exist for OTA updates.
board_build.partitions = min_spiffs.csv
; Firmware version from git tags (FW_VERSION macro, shown in the config web
; page) + a versioned copy of the binary: .pio/build/cyd/cyd-sky-tracker-<ver>.bin
extra_scripts = pre:tools/pio_version.py
; Versions pinned so local builds and GitHub Actions use exactly the same code
; (bump them deliberately; src/display/core/theme/fonts/lcars_efont.c comes
; from this LovyanGFX).
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.3
; Sources live in src/<context>/<layer>/ (spec 12) and include each other by
; their full path from src/ ("display/core/screens/table_view.h").
; No C++ exceptions and no unwind tables: nothing in src/ or the libraries
; throws or catches, an uncaught exception aborts either way, and the ESP32's
; panic backtrace doesn't read .eh_frame. arduino-esp32 2.x builds with
; -fexceptions, which put ~84 KB of .eh_frame in the image (the linker keeps
; every object's copy, duplicated for shared ArduinoJson templates).
build_unflags =
    -fexceptions
build_flags =
    -I src
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables

; Same firmware, uploaded over WiFi to the config page's POST /update
; (spec/done/01-ota-updates.md) instead of USB:  pio run -e cyd-ota -t upload
; The web panel password comes from the CYD_WEB_PASSWORD environment
; variable (empty when the panel has none) — never put it in this file.
; Another board / IP: --upload-port 192.168.1.50. Needs curl (built into
; Windows 10+, macOS, Linux). The board's answer page is saved next to the
; firmware as ota-response.html.
[env:cyd-ota]
extends = env:cyd
upload_protocol = custom
upload_port = cyd-sky.local
upload_command = curl --fail --silent --show-error --digest -u "admin:${sysenv.CYD_WEB_PASSWORD}" -o "$BUILD_DIR/ota-response.html" -F "firmware=@$SOURCE" "http://$UPLOAD_PORT/update"

; Native (host) environment for pure-logic unit tests: bbox math, distance/
; bearing, sorting, token-expiry timing, aircraft_lookup cache, credit-cost
; calculation, JSON parsing, etc. No ESP32, no LovyanGFX, no display, no
; network — see "Testing" in CLAUDE.md. Run with `pio test -e native`.
[env:native]
platform = native
; PlatformIO doesn't link src/ into test builds unless told to.
test_build_src = yes
; Exclude what only runs on the ESP32: the composition roots in src/main/
; (main.cpp, net_task), every context's adapters/ and the ESP32 half of
; platform/ (*_esp32.cpp) pull in Arduino.h / LovyanGFX / WiFi, which don't
; exist on the native (host) platform. Everything else (core/, services/,
; shared/, platform/) is compiled so tests can link against it. `-<main/>`
; matches only src/main/. Filters apply in order, so the last line re-adds
; one adapter: admin/adapters/config_portal.cpp still holds three pure
; functions above its #ifdef ARDUINO (parseOpenSkyCredentialsJson and the
; two number validators), tested by test_admin's config_portal_test — until
; spec 12 stage 4 moves them out of it.
build_src_filter =
    +<*>
    -<main/>
    -<*/adapters/>
    -<platform/*_esp32.cpp>
    +<admin/adapters/config_portal.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; src/: full-path includes (spec 12); test/support/: shared assertions +
; fixtures (test/README.md).
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I src
    -I test/support
    -Wall -Wextra -Werror

; The same tests under AddressSanitizer + UndefinedBehaviorSanitizer; CI
; (firmware.yml, Linux) runs it after the plain native tests:
; `pio test -e native-asan`. Not on Windows: MinGW has no sanitizer runtime.
; (SCons passes -fsanitize* to the linker too, so build_flags is enough.)
[env:native-asan]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-sanitize-recover=undefined
    -fno-omit-frame-pointer
    -g

[platformio]
default_envs = cyd