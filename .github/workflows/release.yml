# Release: on a version tag (git tag v1.2.0 && git push origin v1.2.0)
#   1. builds the firmware (firmware.yml),
#   2. creates the GitHub Release "v1.2.0" with its binaries,
#   3. publishes the project page (site.yml) with that firmware in the
#      browser installer.
# A tag with a suffix (v1.3.0-rc.1, -beta.N, -dev.N) is a development
# version: its Release is marked pre-release — offered only on the config
# page of devices whose admin ticked "show development versions"
# (release_check) — and the project page / web installer are left alone.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
    permissions:
      contents: read

  release:
    needs: firmware
    runs-on: ubuntu-24.04  # pinned, not ubuntu-latest (moving to 26.04): switch deliberately
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.firmware.outputs.artifact }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          generate_release_notes: true

  site:
    needs: [firmware, release]
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/site.yml
    with:
      firmware-artifact: ${{ needs.firmware.outputs.artifact }}
    permissions:
      contents: read
      pages: write
      id-token: write
